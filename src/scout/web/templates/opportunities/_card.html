<article id="opp-card-{{ opp.id }}" class="rounded border border-slate-200 bg-white p-3 text-sm dark:border-slate-800 dark:bg-slate-950">
  <header class="mb-1 flex items-start justify-between gap-2">
    <a href="/opportunities/{{ opp.id }}" class="font-medium hover:underline">{{ opp.title }}</a>
    <span class="shrink-0 rounded px-1.5 py-0.5 text-[10px] uppercase tracking-wider {{ opp.status | status_class }}">{{ opp.status }}</span>
  </header>
  <div class="flex flex-wrap items-baseline gap-x-3 gap-y-1 text-xs text-slate-600 dark:text-slate-400">
    <span class="{{ opp.deadline | deadline_class }}">{{ opp.deadline | deadline_label(opp.deadline_note) }}</span>
    <span>fit {{ opp.fit_score | fit_dots }}</span>
    <span>angle {{ opp.primary_angle or '?' }}</span>
    <span>{{ opp.type }}</span>
  </div>
  {% if opp.why_fits %}
    <p class="mt-2 text-xs text-slate-600 dark:text-slate-400">{{ opp.why_fits | short(160) }}</p>
  {% endif %}
</article>
