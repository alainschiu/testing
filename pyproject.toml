[project]
name = "scout"
version = "0.1.0"
description = "Opportunity Scout & Application Console — single-user local-first arts-funding agent"
requires-python = ">=3.12"
dependencies = [
    "anthropic>=0.42.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.20",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "typer>=0.13.0",
    "structlog>=24.4.0",
    "apscheduler>=3.10.4",
    "httpx>=0.27.0",
    "tavily-python>=0.5.0",
    "selectolax>=0.3.21",
    "feedparser>=6.0.11",
    "pyyaml>=6.0.2",
]

[project.optional-dependencies]
# Playwright is ~400MB once Chromium is installed (`playwright install chromium`).
# Watchers with kind='html_js' need it; the rest of the app runs without it.
js = ["playwright>=1.49.0"]

[project.scripts]
scout = "scout.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scout"]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B", "SIM"]
ignore = ["E501"]
